# Document Graph building profiles
default_profile: wiki

docgraph_profiles:
  wiki:
    description: "Wiki — docling conversion, uncaptioned-image VLM descriptions, hybrid retrieval"
    markdownize_profile: docling

    paths:
      sources_dir: ${paths.data_root}/sources
      markdown_dir: ${paths.data_root}/markdown
      kg_db: ${paths.data_root}/kg/wiki.db

    llms:
      summary: deepseek-v4-flash-0731(none)@openrouter  # structure discovery & section descriptions
      image: gemini-2.5-flash@openrouter                # VLM for image QA (query_image)

    embeddings: qwen3_06b@deepinfra     # SectionChunk vectors — enables hybrid (vector + BM25) search

    images:
      enabled: true
      describe_uncaptioned: true
      min_size_bytes: 10240
      max_queries_per_turn: 3

    build:
      structure_strategy: auto
      generate_summaries: true
      summary_min_tokens: 800
      context_safety_ratio: 0.9
      fts: true
      chunk_size_tokens: 1500
      workers: 4
      skip_ocr: false
      force: false

  default:
    description: "Default Document Graph construction profile"
    markdownize_profile: best

    paths:
      sources_dir: ${paths.data_root}/pdfs
      markdown_dir: ${paths.data_root}/markdown_multi
      kg_db: ${paths.data_root}/kg/wiki.db
      saved_markdown_dir: ~/OneDrive/prj/wiki/markdown

    llms:
      summary: default
      image: null

    images:
      enabled: false
      describe_uncaptioned: false
      min_size_bytes: 10240
      max_queries_per_turn: 3

    build:
      structure_strategy: auto
      generate_summaries: true
      summary_min_tokens: 800
      context_safety_ratio: 0.9
      fts: true
      chunk_size_tokens: 1500
      workers: 4
      skip_ocr: false
      force: false
