# ---------------------------------------------------------------------------
# Wiki ingest route table
# ---------------------------------------------------------------------------
# Consumed by `wiki add` (routes resolved from
# docgraph_profiles.<profile>.ingest_routes): wiki sources are dispatched
# through this table — the markdownize flow with the 'docling' profile
# (docling conversion with easyocr, image extraction and uncaptioned-image
# VLM descriptions).
#
# !! FIRST MATCH WINS: rules are evaluated top-down and the first rule whose
# pathspec matches routes the item. Reordering rules silently re-routes
# sources (the table fingerprint feeds the caches).
# Workflow refs are dotted import paths (like the built-in 'default' table's
# web-page rule) so they resolve in any project, independent of which YAML
# workflow files the project ships.
ingest_routes:

  wiki:
    description: >
      Wiki sources — git repositories through git_repo flow, web URLs through
      web_page flow, and files through the markdownize flow (profile 'docling':
      docling conversion with image extraction and VLM descriptions).
    routes:
      - pathspec: "https://github.com/**"
        workflow: genai_tk.workflow.prefect.flows.git_repo_flow.git_repo_flow
        with:
          profile: docling
      - pathspec: "https://gitlab.com/**"
        workflow: genai_tk.workflow.prefect.flows.git_repo_flow.git_repo_flow
        with:
          profile: docling
      - pathspec: "https://bitbucket.org/**"
        workflow: genai_tk.workflow.prefect.flows.git_repo_flow.git_repo_flow
        with:
          profile: docling
      - pathspec: "**/*.git"
        workflow: genai_tk.workflow.prefect.flows.git_repo_flow.git_repo_flow
        with:
          profile: docling
      - pathspec: "git@**"
        workflow: genai_tk.workflow.prefect.flows.git_repo_flow.git_repo_flow
        with:
          profile: docling
      - pathspec: "https://**"
        workflow: genai_tk.workflow.prefect.flows.web_page_flow.web_page_flow
      - pathspec: "http://**"
        workflow: genai_tk.workflow.prefect.flows.web_page_flow.web_page_flow
      - pathspec: "**/*"
        workflow: genai_tk.workflow.markdownize.markdownize_flow
        with:
          profile: docling
